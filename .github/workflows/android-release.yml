name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore update signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KONTOKLAR_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.KONTOKLAR_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KONTOKLAR_SIGNING_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kontoklar-signing.p12"
          echo "KONTOKLAR_SIGNING_KEYSTORE=$RUNNER_TEMP/kontoklar-signing.p12" >> "$GITHUB_ENV"
          echo "KONTOKLAR_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KONTOKLAR_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          KONTOKLAR_BANKING_API_BASE_URL: ${{ vars.KONTOKLAR_BANKING_API_BASE_URL }}
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest assembleRelease
      - name: Store signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KontoKlar-${{ github.ref_name }}-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "KontoKlar $GITHUB_REF_NAME"
          sleep 20
      - name: Upload APK release asset
        uses: softprops/action-gh-release@v2
        env:
          BANKING_API_BASE_URL: ${{ vars.KONTOKLAR_BANKING_API_BASE_URL }}
        with:
          tag_name: ${{ github.ref_name }}
          name: KontoKlar ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Automatisierter Android-Build.
            Live-Banking ist in diesem Build noch deaktiviert; Kontoauszüge können lokal importiert werden.
            Installation und Updates werden vom Android-System bestätigt.
