name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore update signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KONTOKLAR_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.KONTOKLAR_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KONTOKLAR_SIGNING_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kontoklar-signing.p12"
          echo "KONTOKLAR_SIGNING_KEYSTORE=$RUNNER_TEMP/kontoklar-signing.p12" >> "$GITHUB_ENV"
          echo "KONTOKLAR_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KONTOKLAR_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          KONTOKLAR_BANKING_API_BASE_URL: ${{ vars.KONTOKLAR_BANKING_API_BASE_URL }}
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest assembleRelease
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          BANKING_API_BASE_URL: ${{ vars.KONTOKLAR_BANKING_API_BASE_URL }}
        run: |
          if [ -n "${BANKING_API_BASE_URL:-}" ]; then
            BANKING_NOTE="Live-Banking-Backend konfiguriert; die Verbindung zu Bank und Kontotypen hängt von der Freigabe des Anbieters ab."
          else
            BANKING_NOTE="Live-Banking ist in diesem Build noch deaktiviert. Kontoauszüge können lokal importiert werden."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "KontoKlar $GITHUB_REF_NAME" \
            --notes "Automatisierter Android-Build. $BANKING_NOTE Installation und Updates werden vom Android-System bestätigt."
          for attempt in 1 2 3; do
            if timeout 10m gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "GitHub konnte das APK nach drei Versuchen nicht als Release-Asset speichern." >&2
          exit 1
