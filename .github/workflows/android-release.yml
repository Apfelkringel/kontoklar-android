name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore update signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KONTOKLAR_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kontoklar-signing.jks"
          echo "KONTOKLAR_SIGNING_KEYSTORE=$RUNNER_TEMP/kontoklar-signing.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "KontoKlar $GITHUB_REF_NAME" \
            --notes "Automatisierter Android-Build. Installation und Updates werden vom Android-System bestätigt."
