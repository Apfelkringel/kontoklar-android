name: Test Android and banking API

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

  banking-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: banking-api/package-lock.json
      - run: npm ci
      - run: npm run check
